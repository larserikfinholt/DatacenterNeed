evidence:
  - id: statnett-inventory-completeness-2026
    stance: mixed
    finding: Statnett publishes queued reserved and connected cases but states that records have been manually registered since 2018 and may contain gaps.
    method: Review of Statnett connection-statistics scope note
    applicability: Limits completeness claims for any Norway data-centre project inventory assembled from current public grid statuses.
    funding_and_conflicts: Statnett is the Norwegian transmission system operator and publisher of the status data.
    limitations: No project-level machine-readable export or alias mapping was verified for this dataset.
    source_ids: [statnett-connection-statistics-limitations]
    affected_assumption_source_ids: []