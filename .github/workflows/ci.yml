name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install frozen dependencies
        run: uv sync --frozen
      - name: Test
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Validate synthetic input
        run: uv run datacenter-need validate --input data/examples/synthetic.yaml
      - name: Build offline synthetic artifacts
        run: uv run datacenter-need build --offline --input data/examples/synthetic.yaml --output build/example