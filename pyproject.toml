[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datacenter-need"
version = "0.1.0"
description = "Transparent data-centre demand calculation contracts"
requires-python = ">=3.12"
dependencies = [
    "pint>=0.24,<1",
    "pydantic>=2.10,<3",
    "PyYAML>=6.0,<7",
]

[project.scripts]
datacenter-need = "datacenter_need.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/datacenter_need"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
